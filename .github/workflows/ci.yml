name: MCP Server CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - '.github/workflows/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests & Build
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short Git SHA for tagging
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/product-intelligence-mcp
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:v-${{ steps.vars.outputs.sha_short }}

      - name: Checkout Infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: JunaidUthman/product-intelligence-K8s-Infrastructure
          token: ${{ secrets.INFRA_PAT }}
          path: infra-repo

      - name: Update image tag in mcp-server manifest
        env:
          NEW_IMAGE: junaiduthman/product-intelligence-mcp:v-${{ steps.vars.outputs.sha_short }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd infra-repo

          # Update image using yq directly on the YAML manifest
          yq -i '.spec.template.spec.containers[0].image = env(NEW_IMAGE)' base/mcp-server/mcp-server.yaml

          # Commit and push ONLY mcp-server.yaml
          git add base/mcp-server/mcp-server.yaml
          git diff --staged --quiet || (git commit -m "chore(gitops): update mcp-server image to ${NEW_IMAGE}" && git push)

