name: MCP Server CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Dockerfile'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests & Build
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short Git SHA for tagging
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/product-intelligence-mcp
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:v-${{ steps.vars.outputs.sha_short }}

      - name: Checkout Infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: JunaidUthman/product-intelligence-K8s-Infrastructure
          token: ${{ secrets.INFRA_PAT }}
          path: infra-repo

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tag in Kubernetes Infrastructure repository
        env:
          IMAGE_TAG: v-${{ steps.vars.outputs.sha_short }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd infra-repo/base

          # Use kustomize to set the new image tag
          kustomize edit set image junaiduthman/product-intelligence-mcp=junaiduthman/product-intelligence-mcp:${IMAGE_TAG}

          # Commit and push changes
          git add kustomization.yaml
          git diff --staged --quiet || (git commit -m "chore(gitops): update product-intelligence-mcp image to ${IMAGE_TAG}" && git push)

